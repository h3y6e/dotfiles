# https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2
start-at-login = true
auto-reload-config = true

# https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# https://nikitabobko.github.io/AeroSpace/guide#layouts
# tiles | accordion
default-root-container-layout = 'tiles'
# horizontal | vertical | auto
default-root-container-orientation = 'horizontal'

# https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

focus-follows-mouse.enabled = false

# https://nikitabobko.github.io/AeroSpace/guide#key-mapping
# qwerty | dvorak | colemak
key-mapping.preset = 'qwerty'

# constant | per monitor: [{ monitor.main = 16 }, { monitor."pattern" = 32 }, 24]
gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.bottom = 0
gaps.outer.top = 0
gaps.outer.right = 0

persistent-workspaces = ["1", "2"]

# https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
# main | secondary | built-in | <sequence number> | <monitor name regex>
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'secondary'

# https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]
# https://nikitabobko.github.io/AeroSpace/commands#move
# left | down | up | right
ctrl-alt-cmd-leftSquareBracket = 'move --boundaries-action stop left'
ctrl-alt-cmd-rightSquareBracket = 'move --boundaries-action stop right'
# https://nikitabobko.github.io/AeroSpace/commands#fullscreen
# (omit to toggle) | on | off
ctrl-alt-cmd-equal = 'fullscreen'
# https://nikitabobko.github.io/AeroSpace/commands#resize
# smart | smart-opposite | width | height; amount: +N | -N | N (absolute)
ctrl-alt-cmd-shift-leftSquareBracket = 'resize smart -50'
ctrl-alt-cmd-shift-rightSquareBracket = 'resize smart +50'
# https://nikitabobko.github.io/AeroSpace/commands#balance-sizes
ctrl-alt-cmd-0 = 'balance-sizes'

# https://nikitabobko.github.io/AeroSpace/guide#shell
# https://nikitabobko.github.io/AeroSpace/commands#workspace
ctrl-alt-cmd-tab = 'echo -- 1 2 | workspace --stdin --wrap-around next'
# https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
ctrl-alt-cmd-minus = 'echo -- 1 2 | move-node-to-workspace --stdin --wrap-around --focus-follows-window next'
