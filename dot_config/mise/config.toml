#:tombi schema.strict = false
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.7"

[settings]
activate_aggressive = true
cargo.binstall = true
color_theme = "catppuccin"
experimental = true
install_layout = "identity"
lockfile = true
minimum_release_age = "1d"
npm.package_manager = "aube"
pin = true
pypi.uvx = true
task.monorepo_depth = 2
tool_update.global_auto = true

[settings.self_update]
auto = true
check_duration = "1d"

[settings.skills]
dir = ".agents/skills"
prune = true

[settings.status]
show_env = true
show_tools = true

# For Renovate:
# - Prefer short names; use full names (npm:sfw) for tools not in the mise registry
# - Pin versions, except "latest" for tools whose registry backends are only asdf/vfox plugins
#   https://docs.renovatebot.com/modules/manager/mise/
[tools]
"aqua:k1LoW/git-wt" = "0.30.0"
ast-grep = "0.51.0"
aube = { version = "2.8.4", workflow = [
  "release-plz.yml@refs/heads/main",
  "release.yml@refs/heads/main",
] }
aws = { version = "2.39.2", symlink_bins = "true" }
bat = "0.26.1"
bun = "1.4.4"
cargo-binstall = "1.26.1"
chezmoi = "2.73.3"
claude-code = "2.1.312"
