colima = "0.10.3"
copilot-cli = "1.0.105"
cosign = "3.1.4"
d2 = "0.9.0"
deno = "2.9.8"
direnv = "2.38.2"
docker-cli = "29.9.2"
docker-compose = "5.6.1"
fd = "10.5.0"
ffmpeg = "9.0.2"
fzf = "0.74.5"
gcloud = "latest"
gh = "2.103.3"
ghalint = "1.5.7"
ghq = "1.11.2"
"github:docker/buildx" = { version = "0.38.1", bin = "docker-buildx" }
go = "1.27.3"
